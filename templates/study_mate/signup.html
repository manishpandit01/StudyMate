{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Create account | StudyMate</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link href="{% static 'css/styles.css' %}" rel="stylesheet" />
  </head>

  <body>
    <main class="auth-page auth-single">
      <section class="auth-panel auth-centered">
        <a class="brand" href="dashboard.html"
          ><span class="brand-mark"><i class="bi bi-mortarboard"></i></span
          >StudyMate AI</a
        >
        <form
          class="auth-card register-card"
          method="POST"
          action="{% url 'signup' %}"
        >
          {% csrf_token %}
          <h2>Create an account</h2>
          <p class="panel-subtitle mb-4">
            Sign up to start learning with StudyMate.
          </p>
          {% if messages %}
            {% for message in messages  %}
              <div class="alert alert-{{message.tags}} alert-dismissible fade show">
                {{message}}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
              </div>
            {% endfor %}
          {% endif %}
          <div class="mb-3">
            <label class="form-label" for="full-name">Full Name</label
            ><input
              id="full-name"
              name="full_name"
              class="form-control"
              placeholder="Enter Your name."
              
              autocomplete="name"
              value="{{request.POST.full_name|default:''}}"
            />
          </div>
          <div class="mb-3">
            <label class="form-label" for="email">Email Address</label
            ><input
              id="email"
              name="email"
              type="email"
              class="form-control"
              placeholder="studymate@gmail.com"
            
              autocomplete="email"
              value="{{request.POST.email|default:''}}"
            />
          </div>
          <div class="mb-3">
            <label class="form-label" for="password">Password</label>
            <div class="password-wrap">
              <input
                id="password"
                name="password"
                type="password"
                class="form-control"
                placeholder="At least 8 characters"
                minlength="8"
              
                autocomplete="new-password"
                
              /><button
                class="password-toggle"
                type="button"
                data-password-toggle="password"
                aria-label="Show password"
              >
                <i class="bi bi-eye"></i>
              </button>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label" for="confirm-password"
              >Confirm Password</label
            >
            <div class="password-wrap">
              <input
                id="confirm-password"
                name="confirm_password"
                type="password"
                class="form-control"
                placeholder="Re-enter your password"
                minlength="8"
             
                autocomplete="new-password"
              /><button
                class="password-toggle"
                type="button"
                data-password-toggle="confirm-password"
                aria-label="Show password"
              >
                <i class="bi bi-eye"></i>
              </button>
            </div>
          </div>
          <div class="form-check mb-3">
            <input
              class="form-check-input"
              type="checkbox"
              id="terms"
              name="terms"
             
            /><label class="form-check-label small text-muted" for="terms"
              >I agree to the <a href="#">Terms &amp; Conditions</a></label
            >
          </div>
          <button class="btn btn-primary w-100" type="submit">
            Create Account
          </button>
          <p class="text-center small-muted mt-4 mb-0">
            Already have an account? <a href="{% url 'login' %}">Sign in</a>
          </p>
        </form>
      </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  
  </body>
</html>
