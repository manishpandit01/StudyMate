{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in | StudyMate</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link href="{% static 'css/styles.css' %}" rel="stylesheet" />
  </head>
  <body>
    <main class="auth-page auth-single">
      <section class="auth-panel auth-centered">
        <a class="brand" href="dashboard.html"
          ><span class="brand-mark"><i class="bi bi-mortarboard"></i></span
          >StudyMate AI</a
        >
        <form class="auth-card" method="POST" action="{% url 'login' %}">
          {% csrf_token %}
          <h2>Welcome back</h2>
          <p class="panel-subtitle mb-4">Sign in to continue learning.</p>
          {% if messages %} {% for message in messages %}
          <div class="alert alert-{{message.tags}} alert-dismissable fade show">
            {{message}}
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="alert"
            ></button>
          </div>
          {% endfor %} {% endif %}
          <div class="mb-3">
            <label class="form-label" for="email">Email Address</label
            ><input
              id="email"
              type="email"
              name="email"
              class="form-control"
              placeholder="studymate@gmail.com"
              required
              autocomplete="email"
            />
          </div>
          <div class="mb-3">
            <label class="form-label" for="password">Password</label>
            <div class="password-wrap">
              <input
                id="password"
                type="password"
                name="password"
                class="form-control"
                placeholder="Your password"
                required
                autocomplete="current-password"
              /><button
                class="password-toggle"
                type="button"
                data-password-toggle="password"
                aria-label="Show password"
              >
                <i class="bi bi-eye"></i>
              </button>
            </div>
          </div>
          <div class="d-flex justify-content-between align-items-center mb-3">
            <div class="form-check">
              <input
                class="form-check-input"
                type="checkbox"
                name="remember"
                id="remember"
              /><label class="form-check-label small text-muted" for="remember"
                >Remember me</label
              >
            </div>
            <!-- <a class="small" href="#">Forgot password?</a> -->
          </div>
          <button class="btn btn-primary w-100" type="submit">Sign In</button>
          <p class="text-center small-muted mt-4 mb-0">
            Don't have an account? <a href="{% url 'signup' %}">Create account</a>
          </p>
        </form>
      </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/app.js' %}"></script>
  </body>
</html>
